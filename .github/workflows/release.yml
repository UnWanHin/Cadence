name: release

# Push a tag like v0.2.0 and this builds the signed APK and publishes it as a
# release asset named cadence.apk, which is exactly what the in-app updater
# looks for.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The runner already ships an Android SDK; the setup-android action insists
      # on installing the retired "tools" package and fails, so point at the
      # preinstalled one and install only what this build needs.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" \
                        "ndk;27.0.12077973" "cmake;3.22.1"

      # The keystore must be the same one used by every previous release,
      # otherwise Android refuses to install the update over the old app.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. An unsigned fallback would"
            echo "::error::produce an APK that cannot update an installed one."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/keystore.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew :app:assembleRelease --no-daemon

      - name: Collect artifact
        run: |
          ls -l android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/cadence.apk ./cadence.apk
          sha256sum cadence.apk > cadence.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            cadence.apk
            cadence.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
